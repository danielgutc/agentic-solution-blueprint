schema_version = 1
blueprint_version = "2.1"
profile = "full-software-development"
supported_workflows = ["requirements-first", "design-first"]
# Keep unset only in the reusable template. A consuming project must select one.
selected_workflow = "unset"

[paths]
instructions = ".blueprint/instructions"
templates = ".blueprint/templates"
product = "design/foundation/product.md"
mvp = "design/foundation/mvp.md"
requirements = "design/foundation/requirements.md"
technology = "design/foundation/tech.md"
design = "design/foundation/design.md"
delivery = "design/foundation/delivery.md"
task_tracker = "design/foundation/task.md"
traceability = "design/foundation/traceability-matrix.md"
implementation_readiness = "design/foundation/implementation-readiness.md"
c4 = "design/c4"
c4_system = "design/c4/system/system.md"
c4_system_containers = "design/c4/containers/system-containers.md"
code = "design/code"
implementation = "implementation"
deployment = "deployment"
repository_artifacts = "artifacts"
integration_tests = "tests/integration"
end_to_end_tests = "tests/e2e"
tools = "tools"
project_skills = ".agents/skills"

[coordination]
role_catalog = "user-level-agentic-engineering-toolkit"
status_standard = ".blueprint/instructions/standards/status-taxonomy.md"
handoff_fields = ["scope", "inputs", "decisions", "evidence", "risks", "next_owner"]

[tooling]
manifest = ".blueprint/tooling.toml"
runtime = "python>=3.11"
adoption = "copy-manifest-files-with-pinned-blueprint-preserve-project-adapters"
doxygen_renderer = "tools/docs/generate_doxygen_docs.py"
markdown_checker = "tools/docs/check_navigation.py"
drawio_exporter = "tools/diagrams/export_drawio_svg.py"

[documentation]
policy = ".blueprint/instructions/file-types/api-documentation.md"
generator_config_schema_version = 2
compatible_generator_config_schema_versions = [1, 2]
default_api_generator = "doxygen"
default_api_intermediate = "doxygen-xml"
api_generator_exception_policy = "record-in-design/foundation/tech.md-with-capability-evidence"
diagram_source = "drawio"
diagram_export = "svg"
diagram_export_policy = "committed-sibling"
code_contract_source = "implementation-source-comments-and-tests"
component_narrative = "human-authored"
canonical_api_reference = "generated-and-committed-per-implementation-unit-and-documentation-profile"
architecture_code_views = "generated-and-committed-link-projections"
code_diagram_sources = "generated-and-committed"
api_reference = "generated-ci-artifact"
api_reference_output = "artifacts/api-docs"
c4_container_document_pattern = "design/c4/containers/<container>/<document>.md"
c4_component_document_pattern = "design/c4/containers/<container>/components/<component>/<document>.md"
canonical_code_index_pattern = "design/code/<implementation-unit>/<documentation-profile>/index.md"
canonical_api_reference_pattern = "design/code/<implementation-unit>/<documentation-profile>/api/<scope>/<stable-symbol-id>.md"
canonical_code_diagram_pattern = "design/code/<implementation-unit>/<documentation-profile>/_code-diagrams"
container_code_view_pattern = "design/c4/containers/<container>/code.md"
component_code_view_pattern = "design/c4/containers/<container>/components/<component>/code.md"
interface_code_view_pattern = "design/c4/containers/<container>/_code-views/interfaces.md"
legacy_component_api_reference_pattern = "design/c4/containers/<container>/components/<component>/api/<scope>/<stable-symbol-id>.md"
legacy_component_api_reference_policy = "generated-link-stub"
legacy_component_api_compatibility_window = "through-the-next-blueprint-major-adoption-and-clean-inbound-link-check"

[gates.design_approval]
required = true
before = ["c4-system", "c4-containers"]
evidence = "design/foundation/design.md"

[gates.implementation_readiness]
required = true
before = ["full-development"]
evidence = "design/foundation/implementation-readiness.md"
requires = [
  "approved-system-and-container-architecture",
  "traced-component-design",
  "delivery-governance-recorded",
  "walking-skeleton",
  "reproducible-clean-build",
  "initial-unit-component-and-contract-tests",
  "generated-api-documentation",
  "fresh-code-documentation-projections",
  "formatting-and-static-analysis",
  "versioned-artifact-packaging",
  "non-production-delivery-path",
  "green-ci-pipeline",
]
