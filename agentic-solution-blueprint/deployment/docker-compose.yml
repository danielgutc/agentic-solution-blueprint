version: '3.8'

services:
  petshop-api:
    build:
      context: ../implementation/petshop-api
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__Default=Host=petshop-db;Port=5432;Database=petshop;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=petshop-cache:6379
      - ConnectionStrings__RabbitMQ=petshop-queue
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - petshop-db
      - petshop-cache
      - petshop-queue
    networks:
      - petshop-network

  petshop-web:
    build:
      context: ../implementation/petshop-web
      dockerfile: docker/Dockerfile
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://petshop-api:8080/api
    depends_on:
      - petshop-api
    networks:
      - petshop-network

  petshop-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=petshop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - petshop-db-data:/var/lib/postgresql/data
    networks:
      - petshop-network

  petshop-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - petshop-network

  petshop-queue:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - petshop-network

volumes:
  petshop-db-data:

networks:
  petshop-network:
    driver: bridge
