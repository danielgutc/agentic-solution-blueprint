apiVersion: v1
kind: Namespace
metadata:
  name: petshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: petshop-api-config
  namespace: petshop
data:
  ASPNETCORE_ENVIRONMENT: Production
  --: |
    {
      "ConnectionStrings": {
        "Default": "Host=petshop-db;Port=5432;Database=petshop;Username=postgres;Password=postgres",
        "Redis": "petshop-cache:6379",
        "RabbitMQ": "petshop-queue"
      },
      "Jwt": {
        "Secret": "CHANGE-ME-IN-PRODUCTION",
        "Issuer": "petshop",
        "Audience": "petshop-client"
      },
      "RabbitMQ": {
        "HostName": "petshop-queue",
        "UserName": "guest",
        "Password": "guest"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petshop-api
  namespace: petshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petshop-api
  template:
    metadata:
      labels:
        app: petshop-api
    spec:
      containers:
        - name: petshop-api
          image: ghcr.io/danielgutc/agentic-solution-blueprint/petshop-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: petshop-api-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: petshop-api
  namespace: petshop
spec:
  selector:
    app: petshop-api
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petshop-web
  namespace: petshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: petshop-web
  template:
    metadata:
      labels:
        app: petshop-web
    spec:
      containers:
        - name: petshop-web
          image: ghcr.io/danielgutc/agentic-solution-blueprint/petshop-web:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: petshop-web
  namespace: petshop
spec:
  selector:
    app: petshop-web
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: petshop-api-hpa
  namespace: petshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: petshop-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
